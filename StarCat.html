<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <!-- 預留要動態更新的 meta -->
  <meta property="og:type"         content="website">
  <meta property="fb:app_id"       content="1273479274344511">
  <meta property="og:title"        content="我成為了睡眠守護者！">
  <meta property="og:description"  content="快來看看你能不能打敗失眠大魔王！">
  <meta property="og:image"        content="https://im-kinuko.github.io/img/StarCat.png">
  <meta property="og:image:type"   content="image/png">
  <meta property="og:image:width"  content="255" >
  <meta property="og:image:height" content="477" >
  <meta property="og:url"         content="https://im-kinuko.github.io">
  <!-- meta refresh 也動態設定 -->

  <title>準備跳轉…</title>
</head>
<body>
  <p>正在為你準備分享資訊並跳轉…</p>

  <script>
    // 2. 只有「真實使用者」在這裡執行跳轉
    //    用 location.replace 而非 meta refresh，避免被爬蟲誤判
    window.addEventListener('load', () => {
      // 可以加個 delay 讓使用者感覺到 loading
      setTimeout(() => {
        window.location.replace('https://im-kinuko.github.io');
      }, 100); // 0.1 秒
    });
  </script>
</body>
</html>
