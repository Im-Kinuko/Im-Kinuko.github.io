<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <!-- 預留要動態更新的 meta -->
  <meta property="og:title" content="我成為了睡眠守護者！">
  <meta property="og:description" content="快來看看你能不能打敗失眠大魔王！">
  <meta property="og:image"       content="">
  <meta property="og:url"         content="https://im-kinuko.github.io">
  <!-- meta refresh 也動態設定 -->
  <meta http-equiv="refresh"      content="0;url=https://im-kinuko.github.io">

  <title>準備跳轉…</title>
</head>
<body>
  <p>正在為你準備分享資訊並跳轉…</p>

  <script>
    // 先等 DOM 完全載入
    document.addEventListener('DOMContentLoaded', () => {
      const p = new URLSearchParams(window.location.search);

      // 從參數讀值，找不到就用預設
      const img       = p.get('img')   || '/default-share.png';

      // 協助函式：新增或更新 meta
      function upsertMeta(selector, attr, value) {
        let m = document.head.querySelector(selector);
        if (!m) {
          m = document.createElement('meta');
          if (selector.startsWith('meta[property')) {
            const prop = selector.match(/"(.+?)"/)[1];
            m.setAttribute('property', prop);
          } else if (selector.includes('[http-equiv')) {
            m.setAttribute('http-equiv', 'refresh');
          }
          document.head.appendChild(m);
        }
        m.setAttribute(attr, value);
      }

      // 動態更新 OG 標籤
      upsertMeta('meta[property="og:image"]',       'content', `https://im-kinuko.github.io/img/${img}`);


      // 同步更新頁面 title
      document.title = title;
    });
  </script>
</body>
</html>
